name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Kernel (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-core/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Migrations apply cleanly
        env:
          DATABASE_URL: sqlite:///./ci_check.db
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest

  rust:
    name: Rust (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check (cargo check)
        run: cargo check --all-targets

      - name: Tests (cargo test)
        run: cargo test --all-targets

  android:
    name: Android (Gradle build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Tests (testDebug)
        run: ./gradlew testDebug --stacktrace
