# AndroidX é obrigatório (todas as dependências do app usam AndroidX)
android.useAndroidX=true
android.enableJetifier=false

# Máquina do dono: 2 núcleos / ~12 GB — não deixar o Gradle explodir a RAM
# R8 (minify do release) precisa de heap maior que o debug: 3 GB resolve, mas
# exige ~4 GB livres na máquina. Com pouca RAM livre o release falha com
# OutOfMemoryError (limit de ambiente, não de código) — CI builda normal.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
